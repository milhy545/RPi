name: RPi Dashboard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rpi_hw_tests:
        description: 'Run RPi hardware test suites'
        type: boolean
        default: false
      suite:
        description: 'Specific RPi suite to run'
        type: string
        required: false

env:
  PROJECT_ROOT: /home/milhy777/rpi-dashboard
  PYTHON_VERSION: "3.12"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # LOCAL-SYNC: Runs on GitHub Ubuntu, validates code quality
  # ─────────────────────────────────────────────────────────────────
  local-sync:
    name: Local Sync (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Python compile
        run: .venv/bin/python -m py_compile webserver.py tui.py mode_switcher.py keys2mpv.py

      - name: Extract WebUI JS
        run: .venv/bin/python tools/extract-webui-js.py webserver.py > /tmp/rpi-webui-ci.js

      - name: Node syntax check
        run: node --check /tmp/rpi-webui-ci.js

      - name: Run pytest
        run: .venv/bin/python -m pytest -q --tb=short

      - name: Create receipt and report
        id: receipt
        run: |
          SHA=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          RECEIPT_DIR="conductor/ci/receipts"
          mkdir -p "$RECEIPT_DIR"
          REPORT_DIR="conductor/ci/reports"
          mkdir -p "$REPORT_DIR"
          RECEIPT_FILE="${RECEIPT_DIR}/${SHA}-$(date -u +%Y%m%d-%H%M%S)-github-main.json"
          REPORT_FILE="${REPORT_DIR}/${SHA}-$(date -u +%Y%m%d-%H%M%S)-github-main.md"
          
          # Create report file
          cat > "$REPORT_FILE" <<HEREDOC
# RPi Dashboard CI Report

- Commit: $SHA
- Host: $(hostname)
- Time: $(date -Is)
- Result: PASS
HEREDOC
          
          # Create receipt file
          cat > "$RECEIPT_FILE" <<HEREDOC
{
  "status": "done",
  "commit_sha": "$SHA",
  "tree_hash": "$TREE",
  "source": "github-actions-main-push",
  "ci_report": "$REPORT_FILE",
  "actions_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
  "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
}
HEREDOC
          
          echo "receipt=$RECEIPT_FILE" >> $GITHUB_OUTPUT
          echo "report=$REPORT_FILE" >> $GITHUB_OUTPUT

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt
          path: ${{ steps.receipt.outputs.receipt }}

      - name: Upload CI report
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-ubuntu
          path: ${{ steps.receipt.outputs.report }}

  # ─────────────────────────────────────────────────────────────────
  # RPI-HW: Self-hosted runner on RPi 3B+ (hardware tests)
  # ─────────────────────────────────────────────────────────────────
  rpi-hardware:
    name: RPi Hardware Tests
    runs-on: [self-hosted, rpi, linux, arm]
    timeout-minutes: 60
    if: github.event.inputs.rpi_hw_tests == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Sync from GitHub
        run: |
          cd /home/milhy777/rpi-dashboard
          git fetch origin
          git checkout main
          git pull origin main

      - name: Install dependencies
        run: |
          cd /home/milhy777/rpi-dashboard
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]" --break-system-packages

      - name: Run hardware suite
        id: suite
        run: |
          cd /home/milhy777/rpi-dashboard
          SUITE="${{ github.event.inputs.suite }}"
          if [ -z "$SUITE" ]; then
            SUITE="audio"
          fi
          case "$SUITE" in
            audio)
              .venv/bin/pytest tests/test_audio*.py -v --tb=short
              ;;
            bluetooth)
              .venv/bin/pytest tests/test_bluetooth*.py -v --tb=short
              ;;
            gpio)
              .venv/bin/pytest tests/test_gpio*.py tests/test_cec*.py -v --tb=short
              ;;
            usb)
              .venv/bin/pytest tests/test_usb*.py -v --tb=short
              ;;
            soak-24h)
              .venv/bin/python tools/soak_test.py --duration 24h
              ;;
            verify-done)
              ./tools/verify-done.sh
              ;;
            *)
              echo "Unknown suite: $SUITE"
              exit 1
              ;;
          esac

      - name: Check temperature
        if: always()
        run: |
          vcgencmd measure_temp
          cat /sys/class/thermal/thermal_zone0/temp

      - name: Check memory
        if: always()
        run: |
          free -h

      - name: Upload RPi logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpi-hardware-logs
          path: /home/milhy777/rpi-dashboard/conductor/ci/reports/*.md

  # ─────────────────────────────────────────────────────────────────
  # VERIFY: Run verify-done on RPi after sync
  # ─────────────────────────────────────────────────────────────────
  verify:
    name: Verify Done (RPi)
    runs-on: [self-hosted, rpi, linux, arm]
    needs: [local-sync, rpi-hardware]
    if: always() && (needs.local-sync.result == 'success' || needs.local-sync.result == 'skipped')
    timeout-minutes: 10
    steps:
      - name: Sync and verify
        run: |
          cd /home/milhy777/rpi-dashboard
          git fetch origin
          git checkout main
          git pull origin main
          ./tools/verify-done.sh

      - name: Upload final receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-receipt
          path: conductor/ci/receipts/*.json

  # ─────────────────────────────────────────────────────────────────
  # STATUS: Post status to PR/commit
  # ─────────────────────────────────────────────────────────────────
  status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [local-sync, rpi-hardware, verify]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Summary
        run: |
          echo "## Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Local Sync (Ubuntu) | ${{ needs.local-sync.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RPi Hardware | ${{ needs.rpi-hardware.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Verify Done | ${{ needs.verify.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any critical stage failed
        if: |
          needs.local-sync.result != 'success' ||
          (needs.rpi-hardware.result != 'success' && needs.rpi-hardware.result != 'skipped') ||
          needs.verify.result != 'success'
        run: exit 1