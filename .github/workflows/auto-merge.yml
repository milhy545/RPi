name: Queue PR Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, converted_to_draft]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile auto-merge with current approval state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -Eeuo pipefail
          pr_data="$(gh pr view "$PR_URL" --json state,isDraft,labels,autoMergeRequest)"
          state="$(jq -r '.state' <<<"$pr_data")"
          draft="$(jq -r '.isDraft' <<<"$pr_data")"
          approved="$(jq -r '[.labels[].name] | index("merge-approved") != null' <<<"$pr_data")"
          auto_merge="$(jq -r '.autoMergeRequest != null' <<<"$pr_data")"

          if [[ "$state" == "OPEN" && "$draft" == "false" && "$approved" == "true" ]]; then
            if [[ "$auto_merge" != "true" ]]; then
              gh pr merge "$PR_URL" --auto --rebase --delete-branch
            else
              echo "Auto-merge is already queued for this approved pull request."
            fi
          elif [[ "$auto_merge" == "true" ]]; then
            gh pr merge "$PR_URL" --disable-auto
          else
            echo "Current pull request state does not authorize auto-merge."
          fi
