name: RPi Dashboard CI Fast

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-sync:
    name: Local Sync (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tested revision with Git
        env:
          VERIFY_BASE_SHA: "${{ github.event.pull_request.base.sha || github.event.before || '' }}"
        run: |
          set -Eeuo pipefail
          git init --quiet .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          target_ref="refs/remotes/ci/${GITHUB_RUN_ID}"
          git fetch --no-tags --depth=2 origin "${GITHUB_REF}:${target_ref}"
          if [[ -n "$VERIFY_BASE_SHA" ]] && ! git cat-file -e "${VERIFY_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$VERIFY_BASE_SHA"
          fi
          git checkout --quiet --detach "$target_ref"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Run locked CI and receipt verification
        env:
          CI_PROFILE: github-safe
          PYTHON_BIN: python3.12
          VERIFY_BASE_SHA: "${{ github.event.pull_request.base.sha || github.event.before || '' }}"
        run: tools/github-actions-ci.sh
