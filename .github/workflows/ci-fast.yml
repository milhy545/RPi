name: RPi Dashboard CI Fast

on:
  workflow_call:
  workflow_dispatch:

env:
  PROJECT_ROOT: /home/milhy777/rpi-dashboard
  PYTHON_VERSION: "3.12"

jobs:
  local-sync:
    name: Local Sync (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Python compile
        run: .venv/bin/python -m py_compile webserver.py tui.py mode_switcher.py keys2mpv.py

      - name: Extract WebUI JS
        run: .venv/bin/python tools/extract-webui-js.py webserver.py > /tmp/rpi-webui-ci.js

      - name: Node syntax check
        run: node --check /tmp/rpi-webui-ci.js

      - name: Ruff lint
        run: .venv/bin/ruff check .

      - name: Mypy type check
        run: .venv/bin/mypy .

      - name: Run pytest with coverage gate
        run: |
          .venv/bin/python -m pytest -q --tb=short \
            --cov=rpi_dashboard \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=62

      - name: Bandit high-severity scan
        run: .venv/bin/bandit -q -lll -r . -x ./.venv,./__pycache__,./tests

      - name: Dependency vulnerability audit
        run: .venv/bin/pip-audit --skip-editable

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Create receipt and report
        id: receipt
        run: |
          .venv/bin/python scripts/create_receipt.py

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: ci-receipt
          path: ${{ steps.receipt.outputs.receipt }}

      - name: Upload CI report
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-ubuntu
          path: ${{ steps.receipt.outputs.report }}
